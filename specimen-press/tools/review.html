<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  #g { display: grid; gap: 6px; padding: 6px; }
  figure { margin: 0; } canvas { width: 100%; display: block; } figcaption { padding: 2px 0 4px; }
</style>
<div id="g"></div>
<script src="../specimen-engine.js"></script>
<script>
// review.html?kind=cluster&n=6&cols=3&seed=100&pal=any&scale=1
const q = new URLSearchParams(location.search), n = +(q.get('n') || 6), cols = +(q.get('cols') || 3), seed0 = +(q.get('seed') || 100);
const g = document.getElementById('g'); g.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
const pals = Object.keys(PALETTES), errs = [];
document.fonts.load('italic 30px "IM Fell English"').finally(() => {
  const want = q.get("type"), probe = document.createElement("canvas"); probe.width = 40; probe.height = 50;
  const seeds = []; for (let s = seed0; seeds.length < n && s < seed0 + 4000; s += 13) { if (!want) { seeds.push(s); continue; } const pal0 = pals[(s * 7) % pals.length]; const r = renderPlate(probe, { seed: String(s), kind: q.get("kind") || "any", palette: q.get("pal") && q.get("pal") !== "any" ? q.get("pal") : pal0 }); if ((r.info.sub || r.info.type || r.info.core || r.info.pattern || r.info.cut || r.info.rk) === want) seeds.push(s); }
  for (let i = 0; i < seeds.length; i++) {
    const s = seeds[i], fig = document.createElement('figure'), c = document.createElement('canvas'), cap = document.createElement('figcaption');
    c.width = +(q.get('w') || 700); c.height = c.width * 1.25; fig.append(c, cap); g.appendChild(fig);
    try {
      const pal = q.get('pal') && q.get('pal') !== 'any' ? q.get('pal') : pals[(s * 7) % pals.length];
      const r = renderPlate(c, { seed: String(s), kind: q.get('kind') || 'any', palette: pal, scale: +(q.get('scale') || 1), fx: { misreg: true, grain: true, foxing: false, label: q.get('label') !== '0' } });
      cap.textContent = `${s} · ${r.kind} · ${r.info.form} · ${pal}`;
    } catch (e) { errs.push(s + ': ' + e.message); cap.textContent = 'ERROR ' + e.message; }
  }
  window.errs = errs;
});
</script>
